[package]
name = "dsh-desktop"
version = "2.0.0"
description = "DeepSeek Harness 桌面端（Tauri 版）：内嵌 dsh web GUI，自动拉起后端"
authors = ["A8Chann@github"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "6"
ureq = { version = "2", features = ["json"] }
dirs = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
